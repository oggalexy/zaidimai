name: Atnaujinti games.json

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - '**/message.txt'
      - '**/thumbnail.png'
      - '!**/.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generuoti games.json
        run: node .github/scripts/generate-games.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit ir push jei pasikeitė
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --staged --quiet; then
            echo "games.json nepasikeitė"
          else
            git commit -m "chore: automatiškai atnaujinti games.json"
            git push
          fi
