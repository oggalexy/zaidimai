<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game Hub — Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <div class="admin-header">
      <div>
        <p class="eyebrow">PRIVATE ADMIN</p>
        <h1>Žaidimai</h1>
      </div>
      <div class="actions">
        <a class="button" href="/">Svetainė</a>
        <button id="logout">Atsijungti</button>
        <button id="newGame">+ Naujas žaidimas</button>
      </div>
    </div>

    <div id="adminList" class="admin-list"></div>
  </main>

  <div id="modalBg" class="modal-bg hidden">
    <form id="gameForm" class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Naujas žaidimas</h2>
        <button type="button" id="closeModal">×</button>
      </div>

      <input id="gameId" type="hidden">

      <label>Žaidimo pavadinimas</label>
      <input id="title" type="text" required maxlength="100" placeholder="Pvz. Hydraulic Press">

      <label>Viršelio paveikslėlis</label>
      <input id="cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required>
      <div class="file-note">Atnaujinant galima palikti tuščią ir išsaugoti seną viršelį.</div>

      <label>Žaidimo failai</label>
      <input id="files" type="file" multiple required>
      <div class="file-note">Privalomas index.html. Galima pasirinkti visą žaidimo failų rinkinį.</div>

      <div id="status" class="status"></div>

      <div class="modal-actions">
        <button type="button" id="cancel">Atšaukti</button>
        <button type="submit" id="save">Įkelti</button>
      </div>
    </form>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
