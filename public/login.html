<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin prisijungimas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth">
  <form id="login" class="panel login">
    <h1>Admin</h1>
    <p class="muted">Prisijunk prie žaidimų valdymo.</p>
    <label>Vartotojo vardas</label>
    <input id="username" required autocomplete="username">
    <label>Slaptažodis</label>
    <input id="password" type="password" required autocomplete="current-password">
    <div class="modal-actions">
      <a class="button" href="/">Atgal</a>
      <button type="submit">Prisijungti</button>
    </div>
    <div id="error" class="status"></div>
  </form>
  <script>
    document.querySelector("#login").addEventListener("submit", async e => {
      e.preventDefault();
      const error = document.querySelector("#error");
      const res = await fetch("/api/admin/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          username:document.querySelector("#username").value,
          password:document.querySelector("#password").value
        })
      });
      if(res.ok) location.href="/admin";
      else error.textContent=(await res.json()).error || "Prisijungimas nepavyko.";
    });
  </script>
</body>
</html>
